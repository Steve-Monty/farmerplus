# Review/deploy behind your approved HTTPS reverse proxy. Nothing is public by default.
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set a private database password}
    volumes:
      - keycloak_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  identity:
    build: .
    command: [start, --optimized, --import-realm]
    depends_on:
      database:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set a private database password}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?Set the approved HTTPS identity origin}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KEYCLOAK_TRUSTED_PROXIES:?Set your reverse proxy address or CIDR}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN:?Set the initial private operator name}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:?Set the initial private operator password}
    ports:
      - '127.0.0.1:8180:8080'
    volumes:
      - ${KEYCLOAK_REALM_FILE:?Set the private rendered realm file}:/opt/keycloak/data/import/farmerplus-realm.json:ro
    restart: unless-stopped
volumes:
  keycloak_database:
