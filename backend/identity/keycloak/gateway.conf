server {
    listen 80;
    server_name mobile.agritec.earth;
    access_log off;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 25m;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    location = /auth/callback { try_files /index.html =404; }
    location = /auth/verify { try_files /index.html =404; }
    location = /auth/reset { try_files /index.html =404; }
    location ~ ^/(account|auth|oidc|sync|media|catalogue|packages|learning|community|notifications|sharing|coops|map|maps|admin|login|logout|health|static|tenants|wallets|files|estimate|prepare|jobs)(/|$) {
        set $backend farmerplus-keycloak-backend;
        proxy_pass http://$backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
    # Mini-app endpoints retain their versioned /api prefix.
    location ^~ /api/v1/ {
        set $backend farmerplus-keycloak-backend;
        proxy_pass http://$backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        set $backend farmerplus-keycloak-backend;
        proxy_pass http://$backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}

# Administration and public API have their own host. Mobile API requests above
# stay same-origin and reach the same backend without sharing domain cookies.
server {
    listen 80;
    server_name app.agritec.earth;
    access_log off;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 25m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location = / { return 303 /admin; }
    location / {
        set $backend farmerplus-keycloak-backend;
        proxy_pass http://$backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
