name: farmerplus_mobile
description: Offline farm phone and curated mini-app runtime.
publish_to: none
version: 0.1.5+4021
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  mobile_scanner: 7.4.2
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  html: ^0.15.6
  http: ^1.4.0
  connectivity_plus: ^6.1.4
  workmanager: ^0.10.10
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  maplibre_gl: ^0.26.0
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.5.0
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1
  file_picker: ^10.2.0
  sqflite_common_ffi_web: ^1.1.3
  flutter_appauth: 12.1.0
  battery_plus: ^7.1.1
  pdf: ^3.12.0
  package_info_plus: 9.0.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
  assets:
    - assets/app-icons/
    - assets/countries.json
    - assets/miniapps/
    - assets/wallpapers/
    - assets/packs/
    - assets/branding/wordmark.png
    - assets/branding/fp-original.png
    - assets/branding/farm-wallpaper.png




